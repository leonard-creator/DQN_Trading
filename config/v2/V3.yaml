# PROTOCOL Part II, Step 3 (§V6.3; §V12.1 item 26): V3 = the adopted reference V4 + the signal pack.
#   D1 cross-asset context from TRAINING tickers only (TIP replaces the leave-out IEF): bond / equity momentum
#      (1, 3, 12 months), credit and term spreads (20, 60 days), breadth, dispersion, average correlation,
#      own 3- and 12-month momentum rank; flag ctx_avail (0 in the long history, which has no ETFs)
#   D2 vol-scaled returns over 21-252 days, MACD at three scales, BOCPD changepoints (lambda 21, 126); flag sig_avail
#   D3 auxiliary heads: next 5/20-bar vol-scaled return and next 20-bar log realised vol, weight 0.1
# As V4: pretraining on the 1926-2007 long history (its own checkpoint folder), then every ETF fold fine-tuned with
# 50 % of the budget. Purge stays P = 40 (n = 20, auxiliary labels 20 bars). Compared against V4 (§V8);
# stopping rule 2 applies after this step. +1 trial.
inherit: config/v2/V4.yaml
name: v2_V3
agent:
  features: [log_ret, p_sma20, p_sma50, bb_pctb, rsi14, macd_hist, vol_rel20, atr14_p, sigma20,
             vix_lag1, vix_chg_lag1, resid, resid_cum30, resid_avail, vix_avail,
             tsr21, tsr63, tsr126, tsr252, macd8, macd16, macd32,
             cp21_recent, cp21_age, cp126_recent, cp126_age, sig_avail,
             bond_mom21, bond_mom63, bond_mom252, eq_mom21, eq_mom63, eq_mom252, credit20, credit60, term20, term60,
             breadth, dispersion, corr60, rank63, rank252, ctx_avail]
  algo: {aux_heads: 3, aux_weight: 0.1}
  pretrain: {dir: experiments/runs/pretrain/v2_V3}
